<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA ชาวคลินิก</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #000000;
            --accent-color: #FFD000;
            --bg-color: #F2F2F2;
            --card-bg: #FFFFFF;
            --text-color: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 750px;
            padding: 35px;
            box-sizing: border-box;
            text-align: center;
        }
        h1, h2 { color: var(--primary-color); }
        .department-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 25px; text-align: left;
        }
        .btn-dept {
            background-color: var(--accent-color); 
            border: 2px solid var(--primary-color); 
            color: var(--primary-color); 
            padding: 14px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-dept:hover { background-color: var(--primary-color); color: var(--accent-color); }
        .option-label {
            display: flex; align-items: flex-start; gap: 12px; background: var(--bg-color);
            padding: 15px; border-radius: 8px; cursor: pointer; font-size: 15px; margin-bottom: 10px; transition: background 0.2s; text-align: left;
        }
        .option-label:hover { background: #e0e0e0; }
        .btn-submit {
            background-color: var(--accent-color); color: var(--primary-color); border: none;
            padding: 14px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold;
        }
        .btn-submit:hover { opacity: 0.9; }
        .hidden { display: none !important; }
        
        .animal-hero-box {
            padding: 10px 0;
            margin: 20px 0;
            text-align: center;
        }
        .character-img {
            max-width: 100%;
            height: auto;
            max-height: 250px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .score-display {
            font-size: 15px; margin: 15px 0; background: var(--bg-color);
            padding: 20px; border-radius: 12px; text-align: left; line-height: 1.7;
        }
        .input-box {
            width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; margin-bottom: 20px; text-align: left;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div id="dept-selection">
        <h1>🔍 DNA ชาวคลินิก</h1>
        <p style="color: #666;">พิมพ์ชื่อเล่นของคุณ แล้วเลือกแผนกเพื่อสุ่ม 10 สถานการณ์หน้างานจริง</p>
        
        <div style="margin-top: 20px;">
            <label style="font-weight: bold; display: block; margin-bottom: 8px; text-align: left;">ชื่อของคุณ (หรือชื่อเล่นที่เพื่อนๆ เรียก):</label>
            <input type="text" id="user-nickname" class="input-box" placeholder="เช่น มินท์, พี่ป๊อป, หมอแนน..." autocomplete="off">
        </div>

        <div class="department-grid">
            <button class="btn-dept" onclick="selectDepartment('RC')">RC (Reception)</button>
            <button class="btn-dept" onclick="selectDepartment('TC')">TC (Treatment Coordinator)</button>
            <button class="btn-dept" onclick="selectDepartment('DA')">DA (ผู้ช่วยทันตแพทย์)</button>
            <button class="btn-dept" onclick="selectDepartment('Supply')">Supply (คลัง/ฆ่าเชื้อ)</button>
            <button class="btn-dept" onclick="selectDepartment('SC')">SC (Smile Creator)</button>
            <button class="btn-dept" onclick="selectDepartment('MKT')">MKT (Marketing)</button>
            <button class="btn-dept" onclick="selectDepartment('ACC')">ACC (บัญชี/การเงิน)</button>
            <button class="btn-dept" onclick="selectDepartment('Support')">Support (ฝ่ายสนับสนุน)</button>
            <button class="btn-dept" onclick="selectDepartment('Dentist')">ทันตแพทย์ (Dentist)</button>
            <button class="btn-dept" onclick="selectDepartment('Management')">ผู้บริหาร / หุ้นส่วน</button>
            <button class="btn-dept" onclick="selectDepartment('CM')">ผู้จัดการคลินิก (Clinic Manager)</button>
        </div>
    </div>

    <div id="quiz-section" class="hidden">
        <h2 id="quiz-title"></h2>
        <div id="progress-bar" style="background: #ddd; height: 6px; border-radius: 3px; margin-bottom: 20px;">
            <div id="progress-fill" style="background: var(--accent-color); height: 100%; width: 0%; border-radius: 3px; transition: width 0.3s;"></div>
        </div>
        <div id="question-container" style="text-align: left;"></div>
        <button class="btn-submit" onclick="nextQuestion()">เลือกข้อนี้แล้วไปต่อ</button>
    </div>

    <div id="result-section" class="hidden">
        <h2>🎉 สรุป DNA การทำงานของคุณ</h2>
        
        <div class="animal-hero-box">
            <img id="hero-image" class="character-img" src="" alt="DNA Character">
            <div id="hero-title" style="font-size: 20px; font-weight: bold; color: var(--primary-color);"></div>
            <div id="hero-sub" style="font-size: 15px; color: #555; margin-top: 5px;"></div>
        </div>

        <div class="result-box">
            <div class="score-display" id="score-text"></div>
            <button class="btn-submit" onclick="location.reload()">ทำใหม่อีกครั้ง / กลับหน้าหลัก</button>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPfG1Hb4JOwWR5NMfBni51wSSWFD6vQ5XYqAa6io-2rwxcSQeR9QkzSoxiYv9DbUyT0w/exec";

            { q: "การประชุมที่คุณคิดว่ามีประสิทธิภาพคือ...", o: ["ได้ข้อสรุปและแผนงาน (Action Plan) ภายใน 30 นาที", "มีการนำเสนอข้อมูลเชิงลึกและเปรียบเทียบชัดเจน", "ทุกคนได้ออกความเห็นและเห็นพ้องต้องกัน", "ได้ไอเดียใหม่ๆ ที่ก้าวล้ำออกไปทำต่อ"] },
            { q: "เมื่อต้องตัดสินใจเรื่องสำคัญที่ความเห็นแตกออกเป็น 2 ฝ่าย คุณจะ...", o: ["ใช้อำนาจเด็ดขาดฟันธงเลือกทางที่คิดว่าดีที่สุด", "ให้ทั้งสองฝ่ายกางข้อมูลมาสู้กันแล้วตัดสินด้วยเหตุผล", "พยายามไกล่เกลี่ยหาจุดตรงกลางเพื่อรักษาน้ำใจ", "หาทางเลือกที่ 3 ที่ฉีกกฎเดิมและดีกว่าทั้งสองทาง"] },
            { q: "สิ่งที่คุณอยากเห็นในการพัฒนาทักษะพนักงานคือ...", o: ["เทคนิคการขายและการปิดยอด", "การทำงานอย่างเป็นระบบและลดความผิดพลาด", "การสร้าง Service Mind และความเห็นอกเห็นใจ", "ความคิดริเริ่มสร้างสรรค์และความเป็นผู้นำ"] },
            { q: "เวลาที่คุณเครียดมากๆ จากงานบริหาร คุณมักจะ...", o: ["ออกไปลุยกิจกรรมหนักๆ เพื่อให้ลืมความเครียด", "นั่งทบทวนแผนงานและเอกสารคนเดียว", "ระบายให้เพื่อนสนิทหรือคนในครอบครัวฟัง", "ปลีกตัวไปที่เงียบๆ หรือไปเที่ยวที่แปลกใหม่หาแรงบันดาลใจ"] },
            { q: "แก่นแท้ของการเป็นผู้บริหารสำหรับคุณคือ...", o: ["นักธุรกิจที่นำพาคลินิกไปสู่ความมั่งคั่ง", "ผู้สร้างรากฐานและระบบที่มั่นคง", "ผู้สร้างครอบครัวใหญ่ที่มีความสุข", "นักฝันผู้ขับเคลื่อนวิสัยทัศน์ให้เป็นจริง"] }
        ]
    };

    let currentDept = '';
    let selectedQuestions = []; 
    let currentQIndex = 0;
    let userAnswers = []; 
    let currentShuffledMapping = [];
    let userName = '';

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function selectDepartment(dept) {
        const nameInput = document.getElementById('user-nickname').value.trim();
        if (!nameInput) {
            alert('กรุณากรอกชื่อเล่นของคุณก่อนเริ่มทำแบบทดสอบครับ');
            document.getElementById('user-nickname').focus();
            return;
        }
        userName = nameInput;
        currentDept = dept;
        currentQIndex = 0;
        userAnswers = [];
        
        let allQuestions = masterBank[currentDept];
        let shuffledQuestions = shuffleArray(allQuestions);
        selectedQuestions = shuffledQuestions.slice(0, 10);
        
        document.getElementById('dept-selection').classList.add('hidden');
        document.getElementById('quiz-section').classList.remove('hidden');
        loadQuestion();
    }

    function shuffleOptionsWithMapping(options) {
        let indices = [0, 1, 2, 3];
        for (let i = indices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [indices[i], indices[j]] = [indices[j], indices[i]];
        }
        let shuffledText = [];
        let mapping = [];
        for (let i = 0; i < 4; i++) {
            shuffledText.push(options[indices[i]]);
            mapping.push(indices[i]);
        }
        return { text: shuffledText, map: mapping };
    }

    function loadQuestion() {
        if (currentQIndex < selectedQuestions.length) {
            document.getElementById('quiz-title').innerText = `ข้อที่ ${currentQIndex + 1} / 10`;
            const percent = ((currentQIndex) / 10) * 100;
            document.getElementById('progress-fill').style.width = percent + '%';

            let currentQ = selectedQuestions[currentQIndex];
            const shuffled = shuffleOptionsWithMapping(currentQ.o);
            currentShuffledMapping = shuffled.map;

            let html = `
                <p style="font-size:18px; font-weight:bold; color:var(--primary-color);">Q: ${currentQ.q}</p>
                <div style="margin: 15px 0; display: flex; flex-direction: column;">`;
            
            shuffled.text.forEach((optText, idx) => {
                html += `<label class="option-label">
                    <input type="radio" name="q_opt" value="${idx}"> ${optText}
                </label>`;
            });
            html += `</div>`;
            document.getElementById('question-container').innerHTML = html;
        } else {
            document.getElementById('progress-fill').style.width = '100%';
            setTimeout(showResult, 300);
        }
    }

    function nextQuestion() {
        const selected = document.querySelector('input[name="q_opt"]:checked');
        if (!selected) {
            alert('กรุณาเลือกข้อที่ตรงสัญชาตญาณคุณที่สุดครับ');
            return;
        }
        const uiIndex = parseInt(selected.value);
        userAnswers.push(currentShuffledMapping[uiIndex]);
        currentQIndex++;
        loadQuestion();
    }

    function showResult() {
        document.getElementById('quiz-section').classList.add('hidden');
        document.getElementById('result-section').classList.remove('hidden');

        confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 }
        });

        let tally = [0, 0, 0, 0];
        userAnswers.forEach(ans => tally[ans]++);

        let maxVotes = -1, primaryIndex = -1;
        for(let i=0; i<4; i++) {
            if(tally[i] > maxVotes) { maxVotes = tally[i]; primaryIndex = i; }
        }

        let secondVotes = -1, secondaryIndex = -1;
        for(let i=0; i<4; i++) {
            if(i !== primaryIndex && tally[i] > secondVotes) { secondVotes = tally[i]; secondaryIndex = i; }
        }

        // ตัวแปรหลังบ้านยังคงเป็น Mouse เพื่อรักษาระบบส่งข้อมูลเดิมและชื่อไฟล์รูปเก่า
        const rawNames = ["Bull", "Bear", "Mouse", "Eagle"];
        
        // ตัวแปรหน้าบ้านเปลี่ยนจาก 'หนู' เป็น 'ช้าง' ตามฟีดแบ็ก!
        const thaiNames = ["กระทิง", "หมี", "ช้าง", "อินทรี"];

        let imageKey = rawNames[primaryIndex] + "_" + rawNames[secondaryIndex];
        let selectedImgUrl = IMAGE_LINKS[imageKey] || "";
        
        if(selectedImgUrl === "" || selectedImgUrl.includes("YOUR_IMAGE_LINK")) {
            document.getElementById('hero-image').style.display = "none";
        } else {
            document.getElementById('hero-image').src = selectedImgUrl;
            document.getElementById('hero-image').style.display = "inline-block";
        }

        document.getElementById('hero-title').innerText = `${userName} (${currentDept})`;
        document.getElementById('hero-sub').innerText = `แกนหลัก: ${thaiNames[primaryIndex]} | โหมดเสริม: ${thaiNames[secondaryIndex]}`;

        // อัปเดตคำอธิบายเป็น "ช้าง"
        const deepDescriptions = {
            "Bull": "<b>กระทิง (Action & Result):</b> มีสัญชาตญาณนักสู้ โฟกัสที่เป้าหมายและความรวดเร็ว กล้าตัดสินใจหน้างาน เกลียดความเชื่องช้า ชอบลุยเพื่อผลลัพธ์",
            "Bear": "<b>หมี (Detail & System):</b> เป็นคนละเอียดรอบคอบ ยึดมั่นในระบบ ข้อมูล และความถูกต้องแม่นยำ ทำงานมีขั้นตอนชัดเจน พึ่งพาได้",
            "Mouse": "<b>ช้าง (Empathy & Team):</b> สายซัพพอร์ตแคร์ความรู้สึกคนรอบข้าง มีมนุษยสัมพันธ์ดีเยี่ยม คอยประสานรอยร้าว สร้างบรรยากาศที่อบอุ่นให้แก่ทีม",
            "Eagle": "<b>อินทรี (Vision & Innovation):</b> นักคิดนอกกรอบผู้มองภาพรวมและอนาคต ชอบหาเทรนด์ หรือวิธีแก้ปัญหาใหม่ๆ ที่สร้างสรรค์ไม่ซ้ำใคร"
        };

        document.getElementById('score-text').innerHTML = `
            <strong>🏆 สัตว์หลักประจำตัว: ${thaiNames[primaryIndex]}</strong><br>
            <p style="margin: 5px 0 15px 0; color: #444;">${deepDescriptions[rawNames[primaryIndex]]}</p>

            <strong>✨ สัตว์รอง / โหมดสำรอง: ${thaiNames[secondaryIndex]}</strong><br>
            <p style="margin: 5px 0 15px 0; color: #444;">${deepDescriptions[rawNames[secondaryIndex]]}</p>

            <hr style="border:0; border-top:1px solid #ddd; margin:15px 0;">
            <p style="font-size:13px; color:#777; margin:0; text-align:center;">
                สัดส่วนคะแนนจากการสุ่ม 10 ข้อ: กระทิง(${tally[0]}) | หมี(${tally[1]}) | ช้าง(${tally[2]}) | อินทรี(${tally[3]})
            </p>
        `;

        const payload = {
            name: userName,
            department: currentDept,
            primary: thaiNames[primaryIndex],
            secondary: thaiNames[secondaryIndex],
            scoreBull: tally[0],
            scoreBear: tally[1],
            scoreMouse: tally[2], // ข้อมูลที่ส่งเข้าชีตตัวแปรยังชื่อ Mouse แต่ค่าคะแนนจะเข้าไปปกติ
            scoreEagle: tally[3]
        };

        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).catch(() => {});
    }
</script>
